server {
  listen 8080;
  server_name localhost;
  server_tokens off;

  root /usr/share/nginx/html;

  # The container listens on 8080 but is published on another port, so an
  # absolute redirect sends the browser to a port that is not the one it asked
  # for -- http://localhost:3000/demo became http://localhost:8080/demo/, which
  # is Keycloak. Relative redirects keep whatever host and port the client used.
  absolute_redirect off;

  # Serve static files with caching
  location ~* ^/assets/.*\.(css|js|json|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000";
  }

  # Serve static files
  location / {
      # Deliberately no `$uri/` here. This is a single-page app: every path that
      # is not a file on disk must return index.html so the client-side router
      # can handle it. `$uri/` would match a real directory instead and answer
      # with a 301 adding a trailing slash -- which is exactly what broke
      # `/demo`, since `public/demo/` exists to serve the sample files. A
      # trailing-slash redirect is never what an SPA route wants.
      try_files $uri /index.html;
      # Add no-cache headers
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      add_header Pragma "no-cache";  # HTTP 1.0 header for backward compatibility
      add_header Expires 0;
  }

  # Optionally, handle 404 errors by redirecting to index.html
  error_page 404 =200 /index.html;
}
